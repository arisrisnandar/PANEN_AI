<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEN-AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:          #f4f6f3;
  --surface:     #ffffff;
  --surface-2:   #f8faf7;
  --border:      #e3e8e1;
  --border-2:    #d0d9ce;

  --nav-bg:      #0d2818;
  --nav-h:       54px;

  --green-900:   #0d2818;
  --green-800:   #14532d;
  --green-700:   #166534;
  --green-600:   #16a34a;
  --green-500:   #22c55e;
  --green-400:   #4ade80;
  --green-300:   #86efac;
  --green-100:   #dcfce7;
  --green-50:    #f0fdf4;

  --ink:         #111c13;
  --ink-2:       #344a2f;
  --muted:       #6b7f66;
  --faint:       #a8b9a3;

  --red:         #dc2626;
  --amber:       #d97706;
  --blue:        #2563eb;

  --radius:      14px;
  --radius-sm:   9px;

  --font:        'Plus Jakarta Sans', sans-serif;
  --mono:        'JetBrains Mono', monospace;

  --shadow-sm:   0 1px 4px rgba(0,0,0,0.06);
  --shadow:      0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:   0 12px 40px rgba(0,0,0,0.12);
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius:10px; }

/* ═══════════════════════════════════════════
   HORIZONTAL TOP NAV
═══════════════════════════════════════════ */
.nav-rail {
  width: 100%;
  height: var(--nav-h);
  background: var(--nav-bg);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 200;
  gap: 0;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px 0 0;
  border-right: 1px solid rgba(255,255,255,0.1);
  margin-right: 8px;
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
}
.nav-logo .logo-mark {
  width: 32px; height: 32px;
  background: var(--green-600);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background .2s;
  flex-shrink: 0;
}
.nav-logo:hover .logo-mark { background: var(--green-500); }
.nav-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.nav-logo-text .logo-name {
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}
.nav-logo-text .logo-sub {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--green-400);
  text-transform: uppercase;
  margin-top: 2px;
}

.nav-items {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  height: var(--nav-h);
  position: relative;
  transition: all .2s;
  border-bottom: 2px solid transparent;
}
.nav-item .ni-icon {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  transition: color .2s;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.nav-item .ni-label {
  font-size: 12.5px;
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  white-space: nowrap;
  transition: color .2s;
}
.nav-item:hover .ni-icon,
.nav-item:hover .ni-label {
  color: rgba(255,255,255,0.8);
}
.nav-item.active {
  border-bottom-color: var(--green-400);
  background: rgba(34,197,94,0.08);
}
.nav-item.active .ni-icon { color: var(--green-400); }
.nav-item.active .ni-label { color: #fff; font-weight: 700; }

.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.nav-version {
  font-size: 10px;
  color: rgba(255,255,255,0.2);
  font-family: var(--mono);
  letter-spacing: 0.5px;
  padding-left: 12px;
  border-left: 1px solid rgba(255,255,255,0.1);
}

/* ═══════════════════════════════════════════
   CONTENT AREA
═══════════════════════════════════════════ */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
}

/* ── TOP BAR (breadcrumb + clock, below nav) ── */
.topbar {
  height: 46px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 100;
}

.topbar-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.topbar-breadcrumb .tb-system {
  font-weight: 700;
  color: var(--ink);
  font-size: 13px;
}
.topbar-breadcrumb .tb-sep {
  color: var(--faint);
  font-size: 11px;
}
.topbar-breadcrumb .tb-page {
  color: var(--green-700);
  font-weight: 600;
  font-size: 13px;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ── PAGE CONTAINER ── */
.pages {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.page.active {
  display: flex;
}

/* ── IFRAME PAGES (Peta & Prediksi) ── */
.iframe-page {
  flex: 1;
  border: none;
  width: 100%;
  height: 100%;
  display: block;
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     HORIZONTAL TOP NAV
═══════════════════════════════════════════ -->
<nav class="nav-rail">
  <div class="nav-logo" onclick="switchPage(0)">
    <div class="logo-mark">🌾</div>
    <div class="nav-logo-text">
      <span class="logo-name">PANEN-AI</span>
      <span class="logo-sub">Platform Analitik Nasional untuk Evaluasi dan Prediksi Ketahanan Pangan</span>
    </div>
  </div>

  <div class="nav-items">
    <div class="nav-item active" onclick="switchPage(0)">
      <div class="ni-icon"><i class="fa fa-map-location-dot"></i></div>
      <span class="ni-label">Peta FSVA</span>
    </div>
    <div class="nav-item" onclick="switchPage(1)">
      <div class="ni-icon"><i class="fa fa-chart-line"></i></div>
      <span class="ni-label">Prediksi Harga</span>
    </div>
    <div class="nav-item" onclick="switchPage(2)">
      <div class="ni-icon"><i class="fa fa-triangle-exclamation"></i></div>
      <span class="ni-label">Early Warning</span>
    </div>
  </div>

  <div class="nav-right">
    <div class="nav-version">v1.1.0</div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════
     CONTENT AREA
═══════════════════════════════════════════ -->
<div class="content-area">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-breadcrumb">
      <span class="tb-system">PANEN</span>
      <span class="tb-sep">›</span>
      <span class="tb-page" id="pageTitle">Peta FSVA</span>
    </div>
  </div>

  <!-- ═══ PAGES ═══ -->
  <div class="pages">

    <!-- ───────────────────────────────
         PAGE 0 — PETA FSVA
    ─────────────────────────────────── -->
    <div class="page active" id="page-0">
      <iframe
        class="iframe-page"
        id="iframePeta"
        src="peta.html"
        data-src="peta.html"
        title="Peta FSVA">
      </iframe>
    </div>

    <!-- ───────────────────────────────
         PAGE 1 — PREDIKSI HARGA
    ─────────────────────────────────── -->
    <div class="page" id="page-1">
      <iframe
        class="iframe-page"
        id="iframePrediksi"
        src=""
        data-src="prediksi.html"
        title="Prediksi Harga">
      </iframe>
    </div>

    <!-- ───────────────────────────────
         PAGE 2 — EARLY WARNING PANEL
    ─────────────────────────────────── -->
    <div class="page" id="page-2">
      <iframe
        class="iframe-page"
        id="iframeEWS"
        src=""
        data-src="ews.html"
        title="Early Warning System">
      </iframe>
    </div>

  </div><!-- /pages -->
</div><!-- /content-area -->



<script>
/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
const PAGE_TITLES = [
  'Peta FSVA',
  'Prediksi Harga',
  'Early Warning System'
];

function switchPage(idx) {
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.page').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  document.getElementById('pageTitle').textContent = PAGE_TITLES[idx];

  // Lazy-load iframes on first visit
  const iframes = { 0: 'iframePeta', 1: 'iframePrediksi', 2: 'iframeEWS' };
  if (iframes[idx]) {
    const iframe = document.getElementById(iframes[idx]);
    if (!iframe.src || iframe.src === window.location.href) {
      iframe.src = iframe.getAttribute('data-src');
    }
  }
}
</script>
</body>
</html>
