<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — PANEN-AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #f4f6f3;
  --surface:   #ffffff;
  --border:    #e3e8e1;
  --nav-bg:    #0d2818;
  --green-900: #0d2818;
  --green-700: #166534;
  --green-600: #16a34a;
  --green-500: #22c55e;
  --green-400: #4ade80;
  --green-100: #dcfce7;
  --ink:       #111c13;
  --ink-2:     #344a2f;
  --muted:     #6b7f66;
  --faint:     #a8b9a3;
  --red:       #dc2626;
  --radius:    14px;
  --font:      'Plus Jakarta Sans', sans-serif;
  --shadow:    0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 0;
}

/* ── Background pattern ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(22,163,74,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(22,163,74,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Card ── */
.login-card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 400px;
  padding: 40px 36px;
  margin: 16px;
}

/* ── Logo ── */
.login-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.logo-mark {
  width: 44px; height: 44px;
  background: var(--green-900);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.logo-text .logo-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.logo-text .logo-sub {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── Header ── */
.login-header {
  margin-bottom: 28px;
}
.login-header h1 {
  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.4px;
  margin-bottom: 4px;
}
.login-header p {
  font-size: 13px;
  color: var(--muted);
}

/* ── Form ── */
.form-group {
  margin-bottom: 16px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.input-wrap {
  position: relative;
}
.input-wrap i {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: var(--faint);
  pointer-events: none;
}
.form-input {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 38px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 13.5px;
  color: var(--ink);
  background: var(--bg);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-input:focus {
  border-color: var(--green-600);
  box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
  background: #fff;
}

/* ── Error ── */
.error-msg {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--red);
  font-weight: 500;
  margin-bottom: 16px;
}
.error-msg.show { display: flex; }

/* ── Button ── */
.btn-login {
  width: 100%;
  height: 44px;
  background: var(--green-900);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .2s, transform .1s;
  margin-top: 8px;
}
.btn-login:hover { background: var(--green-700); }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ── Footer ── */
.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: var(--faint);
}
</style>
</head>
<body>

<div class="login-card">

  <!-- Logo -->
  <div class="login-logo">
    <div class="logo-mark">🌾</div>
    <div class="logo-text">
      <div class="logo-name">PANEN-AI</div>
      <div class="logo-sub">Admin Portal</div>
    </div>
  </div>

  <!-- Header -->
  <div class="login-header">
    <h1>Masuk ke Dashboard Admin</h1>
    <p>Hanya untuk administrator sistem PANEN-AI</p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg">
    <i class="fa fa-circle-exclamation"></i>
    <span id="errorText">Username atau password salah</span>
  </div>

  <!-- Form -->
  <form id="loginForm">
    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-wrap">
        <i class="fa fa-user"></i>
        <input
          type="text"
          class="form-input"
          id="username"
          placeholder="Masukkan username"
          autocomplete="username"
          required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input
          type="password"
          class="form-input"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <i class="fa fa-right-to-bracket"></i>
      Masuk
    </button>
  </form>

  <div class="login-footer">
    PANEN-AI v1.1.0 · Badan Riset dan Inovasi Nasional
  </div>
</div>

<script>
const API = '';  // same origin

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btnLogin');
  const errorMsg = document.getElementById('errorMsg');
  const errorTxt = document.getElementById('errorText');

  // Reset error
  errorMsg.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-circle-notch fa-spin"></i> Memverifikasi...';

  try {
    const res = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (data.status === 'success') {
      btn.innerHTML = '<i class="fa fa-check"></i> Berhasil!';
      window.location.href = '/admin';
    } else {
      errorTxt.textContent = data.message || 'Username atau password salah';
      errorMsg.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-right-to-bracket"></i> Masuk';
    }

  } catch (err) {
    errorTxt.textContent = 'Gagal terhubung ke server';
    errorMsg.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-right-to-bracket"></i> Masuk';
  }
});

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('loginForm').requestSubmit();
  }
});
</script>
</body>
</html>
